[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # NEXTAUTH_URL and NEXT_PUBLIC_SUPABASE_URL are expected to appear in the
  # client bundle (NextAuth ships its base URL to the browser, and
  # NEXT_PUBLIC_* vars are public by Next.js convention). Neither is a secret.
  SECRETS_SCAN_OMIT_KEYS = "NEXTAUTH_URL,NEXT_PUBLIC_SUPABASE_URL"
