[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # SITE_URL appears in email links; NEXT_PUBLIC_* vars ship in the client
  # bundle by Next.js convention (the anon key is meant to be public — it's
  # authorized only for what Supabase's access policies allow it to do).
  # None of these are secrets.
  SECRETS_SCAN_OMIT_KEYS = "SITE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"
